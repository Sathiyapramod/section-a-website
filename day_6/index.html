<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- flex - end -->

    <div class="d-flex justify-content-end align-items-end">
      <div class="child">1</div>
      <div class="child">2</div>
      <div class="child">3</div>
    </div>

    <br />
    <br />
    <br />

    <!-- flex - start -->
    <div class="d-flex justify-content-end align-items-center">
      <div class="child">1</div>
      <div class="child">2</div>
      <div class="child">3</div>
    </div>
    <br />
    <br />
    <br />
    <!-- flex - center -->
    <div class="d-flex justify-content-center align-items-center">
      <div class="child">1</div>
      <div class="child">2</div>
      <div class="child">3</div>
    </div>
    <br />
    <br />
    <br />

    <div class="d-flex justify-content-start">
      <div class="child">sathish</div>
      <div class="child">kevin</div>
      <div class="child">aris</div>
      <div class="child">siva</div>
      <div class="child">pugazh</div>
      <div class="child">swetha</div>
      <div class="child">vetri</div>
      <div class="child">muthupandi</div>
    </div>
    <br />
    <br />
    <br />

    <div class="d-flex justify-content-evenly align-items-end">
      <div class="child">1</div>
      <div class="child">2</div>
      <div class="child">3</div>
      <div class="child">4</div>
      <div class="child">5</div>
    </div>
    <br />
    <br />
    <br />
    <!-- space-around -->
    <div class="d-flex justify-content-around">
      <div class="child">1</div>
      <div class="child">2</div>
      <div class="child">3</div>
      <div class="child">4</div>
      <div class="child">5</div>
    </div>
    <br />
    <br />
    <br />
  </body>
</html>
