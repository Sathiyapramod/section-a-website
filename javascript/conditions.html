<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

  <body></body>
  <script>
    var a = 20;

    // if else
    if (a % 2 == 0) {
      console.log("it is even number");
    } else {
      console.log("it is odd number");
    }

    // age is given
    // print -> eligible to vote -> if age > 18
    // print -> not eligible -> if age < 18
    // print -> first time voter -> if age = 18

    var age = 28;

    if (age == 18) {
      console.log("first time voter");
    } else if (age > 18) {
      console.log("eligible to vote");
    } else if (age < 18) {
      console.log("not eligible to vote");
    }
  </script>
</html>
