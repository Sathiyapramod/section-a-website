<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Grids Demo</title>
  </head>
  <body>
    <div class="container">
      <div class="grid-1">
        <img src="https://picsum.photos/id/10/300/300" alt="Forest landscape" />
      </div>
      <div class="grid-2">
        <img src="https://picsum.photos/id/20/300/300" alt="Desk workspace" />
      </div>
      <div class="grid-3">
        <img src="https://picsum.photos/id/30/300/300" alt="Coffee mug" />
      </div>
      <div class="grid-4">
        <img src="https://picsum.photos/id/40/300/300" alt="Cat closeup" />
      </div>

      <!-- second task -->
      <div class="grid-5">
        <img src="https://picsum.photos/id/50/300/300" alt="Forest landscape" />
      </div>
      <div class="grid-6">
        <img src="https://picsum.photos/id/60/300/300" alt="Desk workspace" />
      </div>
      <div class="grid-7">
        <img src="https://picsum.photos/id/70/300/300" alt="Coffee mug" />
      </div>
      <div class="grid-8">
        <img src="https://picsum.photos/id/80/300/300" alt="Cat closeup" />
      </div>
    </div>
  </body>
</html>
