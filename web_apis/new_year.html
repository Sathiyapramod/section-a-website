  <script>
    // make a count down
    let time = 10;
    setInterval(() => {
      if (time > 0) {
        console.log(time);
        time--;
      }
    }, 1000);

    setTimeout(() => {
      alert("Happy new Year");
    }, 11000);
  </script>
