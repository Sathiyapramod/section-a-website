    <title>Document</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .container {
      margin: auto;
      width: 800px;
      height: 800px;
      border: 5px solid black;
      margin-top: 10%;

      display: grid;
      grid-template-rows: repeat(8, 1fr);
      grid-template-columns: repeat(8, 1fr);
    }

    .container > div {
      border: 1px solid black;
      text-align: center;
      font-size: 40px;
    }

    /* option 1 */
    .container > div:nth-child(16n + 2),
    .container > div:nth-child(16n + 4),
    .container > div:nth-child(16n + 6),
    .container > div:nth-child(16n + 8),
    .container > div:nth-child(16n + 9),
    .container > div:nth-child(16n + 11),
    .container > div:nth-child(16n + 13),
    .container > div:nth-child(16n + 15) {
      background-color: black;
    }
  </style>
  <body>
    <div class="container">
      <div>1</div>
